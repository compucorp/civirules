# Pipeline for this extension.
#
#   lint.yml      coding standards (civilint) and PHP version compatibility
#   composer.yml  publishes a tag to the Composer Packages registry
#   phpunit.yml   PHPUnit on the oldest and newest supported PHP/CiviCRM
#   security.yml  dependency audits, secret scanning (gitleaks) and semgrep
#
# All live in infra/extension-ci and are extension-agnostic; see
# https://lab.civicrm.org/infra/extension-ci for what each job does.
variables:
  # psr/log is a verbatim copy of the upstream PSR-3 interface, so it follows
  # PSR-12 rather than the Drupal-derived CiviCRM standard.
  LINT_EXCLUDE: '^(vendor|node_modules|psr)/'

include:
  - project: 'infra/extension-ci'
    ref: main
    file:
      - '/lint.yml'
      - '/composer.yml'
      - '/phpunit.yml'
      - '/security.yml'

# Oldest supported stack: PHP and CiviCRM minimums from extension-ci, raised to
# info.xml's <compatibility> floor.
phpunit:min:
  extends: .phpunit-min

# Early warning of core drift; never blocks a merge request.
phpunit:max:
  extends: .phpunit-max
  allow_failure: true
